name: answer-quiz
# GitHub's cron is heavily throttled, so each run stays alive for ~5h45m polling
# every 4 minutes, then dispatches the next run. The schedule only restarts the
# chain if it ever breaks.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: answer-quiz
  cancel-in-progress: false
jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Poll and answer new rounds
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          stop=$(( $(date +%s) + 345*60 ))
          final=$(date -u -d "2026-10-22T22:00:00Z" +%s)
          while [ "$(date +%s)" -lt "$stop" ] && [ "$(date +%s)" -lt "$final" ]; do
            echo "=== $(date -u +%FT%TZ)"
            git fetch -q origin main && git reset -q --hard origin/main
            python3 run.py || true
            git add answers
            if ! git diff --cached --quiet; then
              git commit -q -m "Answer new rounds"
              git push -q origin HEAD:main && echo pushed || echo "push failed, retrying next loop"
            fi
            sleep 240
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(date +%s)" -lt "$(date -u -d "2026-10-22T22:00:00Z" +%s)" ]; then
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/answer.yml/dispatches" \
              -d '{"ref":"main"}'
          fi
