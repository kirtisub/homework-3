name: test-dispatch
on:
  push:
    branches: [main]
    paths: [.github/workflows/test-dispatch.yml]
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/stderr -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/answer.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "status $code"; [ "$code" = 204 ]
